name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # bắt buộc để xin OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::217512201638:role/github-actions-deploy-role
          aws-region: us-east-1

      - name: Who am I?
        run: aws sts get-caller-identity

      - name: Deploy
        run: aws s3 sync dist s3://github-oidc-bucket-217512201638-us-east-1-an --delete
